# markets/web/worker/wrangler.toml
# 사주팔자 — 범용 멀티마켓 CF Workers 설정
#
# ══════════════════════════════════════════════════════════════
# ⚠️ 배포 전 체크리스트 (CISO H1: KV 미바인딩 시 worker가 503 fail-closed)
#   [ ] 1. KV 네임스페이스 생성 후 아래 REPLACE_WITH_KV_NAMESPACE_ID /
#          REPLACE_WITH_KV_PREVIEW_ID 를 실제 id로 교체 (deploy-cf.ps1이 자동 처리)
#   [ ] 2. Secrets 등록: OPENAI_API_KEY, CREEM_API_KEY, CREEM_WEBHOOK_SECRET,
#          LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN
#   [ ] 3. [vars]의 CREEM_PRODUCT_ID 를 Creem 대시보드 product id(prod_...)로 교체
#   [ ] 4. 라이브 전환 시 CREEM_MODE = "prod" (기본 "test" = 안전)
#   placeholder 상태로 배포하면 /api/checkout, /api/fortune 전부 503/실패 반환됨
# ══════════════════════════════════════════════════════════════
#
# 사전 작업:
#   1. `wrangler login` — CF 계정 인증
#   2. KV 네임스페이스 생성:
#      wrangler kv:namespace create MEISEI_WEB_KV
#      → 생성된 id를 아래에 입력
#   3. Secrets 등록:
#      wrangler secret put OPENAI_API_KEY
#      wrangler secret put CREEM_API_KEY   # Creem test/prod 키 (x-api-key, Bearer 아님)
#      wrangler secret put LINE_CHANNEL_SECRET
#      wrangler secret put LINE_CHANNEL_ACCESS_TOKEN
#
# 배포:
#   wrangler deploy

name = "the-fate-web"
main = "index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ── 공개 환경 변수 ──────────────────────
[vars]
SERVICE_NAME = "The Fate Web"
# 앱 URL — 배포 후 실제 URL로 업데이트
WEB_APP_URL = "https://kgg2512.github.io/saju-paljja/markets/web/app.html"
# LINE_MARKET: 이 Worker가 연결된 LINE OA의 기본 마켓 ("jp"/"th"/"tw")
LINE_MARKET = "jp"
# Creem 결제 (product_id는 비밀 아님 — 공개 vars). API 키만 secret으로 별도 등록.
CREEM_PRODUCT_ID = "REPLACE_WITH_CREEM_PRODUCT_ID"
# CREEM_MODE: "test"(기본, test-api.creem.io) / "prod"(api.creem.io) — 라이브 전 "prod"로
CREEM_MODE = "test"

# ── KV 네임스페이스 ──────────────────────
# 생성 명령: wrangler kv:namespace create MEISEI_WEB_KV
[[kv_namespaces]]
binding = "KV"
id = "d3ea559f977b4236b991aae7f8ce433e"
preview_id = "d3ea559f977b4236b991aae7f8ce433e"

# ── 개발 설정 ──────────────────────────
[dev]
port = 8788
local_protocol = "http"

# ── 빌드 ──────────────────────────────
[build]
command = ""

# ── 데모(작업용 스테이징) 환경 — 회장 지시 2026-07-10 데모/스토어 이원화 ──
# 백엔드 작업은 데모 워커에 먼저 배포·검증 후 프로덕션 배포:
#   wrangler deploy --env demo   → https://the-fate-web-demo.kgg2512.workers.dev
#   검증 PASS 후 → wrangler deploy
# ⚠️ 선행 1회: env별 secrets 별도 등록 필요 (wrangler secret put OPENAI_API_KEY --env demo 등)
# ⚠️ KV는 프로덕션과 공유(세션 데이터 겹침 주의) — 분리 필요 시 전용 네임스페이스 생성
[env.demo]
name = "the-fate-web-demo"

[env.demo.vars]
SERVICE_NAME = "The Fate Web (DEMO)"
WEB_APP_URL = "https://kgg2512.github.io/saju-paljja/markets/web-demo/app.html"
LINE_MARKET = "jp"
CREEM_PRODUCT_ID = "REPLACE_WITH_CREEM_PRODUCT_ID"
CREEM_MODE = "test"

[[env.demo.kv_namespaces]]
binding = "KV"
id = "d3ea559f977b4236b991aae7f8ce433e"
preview_id = "d3ea559f977b4236b991aae7f8ce433e"

# ── Secrets 목록 (값은 wrangler secret put으로만 등록) ──
# OPENAI_API_KEY          — GPT-4o mini 호출
# CREEM_API_KEY           — Creem 결제 처리 (MoR, x-api-key 인증)
# CREEM_WEBHOOK_SECRET    — Creem webhook 서명 검증 (creem-signature, HMAC-SHA256 hex)
#                            Creem 대시보드 Developers > Webhook에서 발급, 엔드포인트 등록 후 확보
# LINE_CHANNEL_SECRET     — LINE Webhook 서명 검증
# LINE_CHANNEL_ACCESS_TOKEN — LINE 메시지 발송 (선택)
#
# ⚠️ 이 파일과 코드에 절대 하드코딩 금지
